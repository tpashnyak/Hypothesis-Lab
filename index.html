<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Canvas Project Hypothesis Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hypothesis testing for the AP Business with Personal Finance Business Canvas Project: deliverables map, startup simulation, hypothesis builder, and FRQ practice lab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
/* Layout: a sticky midnight-navy command bar over a tabbed workspace; each module is a two-column desk (work + reference) that stacks to one column on phones. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#101C36; --muted:#56637E; --line:#D2D9E5;
  --navy:#13244A; --navy-2:#1C3263; --navy-ink:#F4F0E4; --navy-muted:#A9B6D3;
  --gold:#835B0C; --gold-bright:#D3A040; --gold-soft:#F5E9CC; --on-gold:#13244A;
  --good:#1D7448; --good-soft:#DCF0E4; --warn:#93570A; --warn-soft:#FAEBD2; --bad:#AD3535; --bad-soft:#F7DDDD;
  --series2:#2F6C9C; --c-cust:#FFF2BA; --c-prod:#FFE0C2; --c-org:#F4DAE9; --c-ops:#D4EBFA; --c-mkt:#E5DAF1; --c-fin:#DDEFD4; --c-app:#E8EBF0;
  --f-display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --f-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1326; --surface:#111D38; --surface-2:#0D1830; --ink:#E6EAF3; --muted:#9AA7C3; --line:#26375D;
    --navy:#060D1D; --navy-2:#13234A; --navy-ink:#F4F0E4; --navy-muted:#93A1C0;
    --gold:#E4B658; --gold-bright:#E4B658; --gold-soft:#2F2A19; --on-gold:#0A1326;
    --good:#62C996; --good-soft:#123425; --warn:#F1B65E; --warn-soft:#3A2B11; --bad:#F19090; --bad-soft:#3B1B20;
    --series2:#7DB4DE; --c-cust:#3A3420; --c-prod:#3D2D20; --c-org:#3A2535; --c-ops:#183246; --c-mkt:#2D2643; --c-fin:#20341F; --c-app:#232B3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1326; --surface:#111D38; --surface-2:#0D1830; --ink:#E6EAF3; --muted:#9AA7C3; --line:#26375D;
  --navy:#060D1D; --navy-2:#13234A; --navy-ink:#F4F0E4; --navy-muted:#93A1C0;
  --gold:#E4B658; --gold-bright:#E4B658; --gold-soft:#2F2A19; --on-gold:#0A1326;
  --good:#62C996; --good-soft:#123425; --warn:#F1B65E; --warn-soft:#3A2B11; --bad:#F19090; --bad-soft:#3B1B20;
  --series2:#7DB4DE; --c-cust:#3A3420; --c-prod:#3D2D20; --c-org:#3A2535; --c-ops:#183246; --c-mkt:#2D2643; --c-fin:#20341F; --c-app:#232B3A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.005em}
h2{font-size:1.75rem}
h3{font-size:1.2rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* ---------- Command bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);border-bottom:1px solid var(--navy-2)}
.bar-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:4px 10px;min-width:0;flex-wrap:wrap}
@media (max-width:640px){.brand-sub{display:none}}
.brand-mark{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--navy-ink);white-space:nowrap}
.brand-mark b{color:var(--gold-bright);font-weight:800}
.brand-sub{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-muted);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:1px solid transparent;color:var(--navy-muted);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;font-size:.92rem}
.tab:hover{color:var(--navy-ink);background:var(--navy-2)}
.tab[aria-selected="true"]{color:var(--on-gold);background:var(--gold-bright);font-weight:600}

main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.view-head .lede{max-width:66ch;color:var(--muted);margin-top:8px}

/* ---------- Generic pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;line-height:1.2}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold-bright);border-color:var(--gold-bright);color:var(--on-gold)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.star{color:var(--gold);font-weight:700}
label.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88rem}
label.field span.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.95rem;font-weight:400}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem}
.note.good{border-color:var(--good);background:var(--good-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2 > *{min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* ---------- Evidence chain strip ---------- */
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.chain > div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.chain > div:last-child{border-right:0}
.chain .k{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.chain .t{font-family:var(--f-display);font-size:1.1rem;font-weight:700;margin-top:2px}
.chain .d{font-size:.84rem;color:var(--muted);margin-top:4px}
@media (max-width:700px){.chain{grid-template-columns:repeat(2,minmax(0,1fr))}.chain > div:nth-child(2){border-right:0}.chain > div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* ---------- Deliverables map ---------- */
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.map{border-collapse:collapse;width:100%;min-width:860px;font-size:.86rem}
table.map th,table.map td{border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.map thead th{background:var(--navy);color:var(--navy-ink);padding:10px 12px;font-family:var(--f-body);font-weight:700}
table.map thead th small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--navy-muted);letter-spacing:.04em}
table.map tbody th{padding:12px;width:130px;font-weight:700;font-family:var(--f-display);font-size:1rem}
table.map td{padding:8px;border-left:1px solid var(--line)}
table.map td .cells{display:flex;flex-direction:column;gap:6px}
.cell{padding:7px 9px;border-radius:6px;line-height:1.35}
.cell.plain{color:var(--ink);opacity:.82}
.cell.ht{background:var(--surface);border:1.5px solid var(--gold);cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.cell.ht:hover{background:var(--gold-soft)}
.cell.ht[aria-pressed="true"]{outline:2px solid var(--gold-bright);outline-offset:1px;background:var(--gold-soft)}
.cell.ht .pips{display:flex;gap:4px}
.pip{font-family:var(--f-mono);font-size:.62rem;font-weight:600;width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
.pip.on{background:var(--good);border-color:var(--good);color:var(--surface)}
tr.cust > *{background:var(--c-cust)} tr.prod > *{background:var(--c-prod)} tr.org > *{background:var(--c-org)}
tr.ops > *{background:var(--c-ops)} tr.mkt > *{background:var(--c-mkt)} tr.fin > *{background:var(--c-fin)} tr.app > *{background:var(--c-app)}
.map-foot{padding:10px 14px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.map-layout > *{min-width:0}
@media (max-width:1050px){.map-layout{grid-template-columns:minmax(0,1fr)}}
.detail h3{margin-top:4px}
.detail ul{margin:6px 0 0;padding-left:18px}
.detail li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem}
.kv dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0}

/* ---------- Sandbox ---------- */
.biz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.biz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.biz:hover{border-color:var(--gold)}
.mono-tile{width:46px;height:46px;border-radius:9px;background:var(--navy);color:var(--gold-bright);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;flex:none}
.biz h3{font-size:1.25rem}
.meter{height:7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter > i{display:block;height:100%;background:var(--gold-bright)}
.hud{display:flex;gap:10px;flex-wrap:wrap}
.hud .stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:110px}
.hud .stat .v{font-family:var(--f-mono);font-size:1.2rem;font-weight:600}
.hud .stat .l{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mission{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.mission:hover{border-color:var(--gold)}
.mission .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mission .nm{font-weight:600;line-height:1.35}
.mission.done{background:var(--surface-2)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps .s{font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps .s.cur{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);font-weight:600}
.steps .s.past{color:var(--good);border-color:var(--good)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:3px}
.opt[aria-pressed="true"] .dot{border-color:var(--gold);background:var(--gold)}
.opt:disabled{cursor:not-allowed;opacity:.5}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.method{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.method:hover{border-color:var(--gold)}
.method[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.method:disabled{cursor:not-allowed;opacity:.5}
.method b{font-size:.95rem}
.method .kind{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.method p{font-size:.82rem;color:var(--muted)}
.slider-row{display:flex;gap:14px;align-items:center}
.slider-row input[type=range]{flex:1;accent-color:var(--gold-bright)}
.slider-row .big{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;min-width:72px;text-align:right}
.hyp-preview{font-family:var(--f-display);font-size:1.15rem;line-height:1.45;padding:14px 16px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--gold)}
.quote{font-style:italic;padding:8px 12px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 6px 6px 0;font-size:.9rem}
.quote.pos{border-color:var(--good)} .quote.neg{border-color:var(--bad)}
table.data{border-collapse:collapse;width:100%;font-size:.88rem}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.data td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.scorebar{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.9rem}
.scorebar .pts{font-family:var(--f-mono);font-weight:600;text-align:right}
.chain-out{font-size:.92rem;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.chain-out b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:6px}
.chart{width:100%;height:auto;display:block}

/* ---------- Builder ---------- */
.dlist{display:flex;flex-direction:column;gap:6px}
.ditem{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.ditem:hover{border-color:var(--gold)}
.ditem[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.ditem .u{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ditem .nm{font-weight:600;font-size:.9rem;line-height:1.3}
.builder{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.builder > *{min-width:0}
@media (max-width:900px){.builder{grid-template-columns:minmax(0,1fr)}}
.section-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-h .n{font-family:var(--f-mono);font-size:.75rem;font-weight:600;width:26px;height:26px;border-radius:6px;background:var(--navy);color:var(--gold-bright);display:grid;place-items:center;flex:none}
.checks{display:flex;flex-direction:column;gap:5px;font-size:.86rem}
.checks .c{display:flex;gap:8px;align-items:flex-start}
.checks .c i{font-style:normal;font-family:var(--f-mono);font-weight:700;width:16px;flex:none}
.checks .c.ok i{color:var(--good)} .checks .c.no i{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields > *{min-width:0}
@media (max-width:620px){.fields{grid-template-columns:minmax(0,1fr)}}
.fit-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.fit{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.86rem;cursor:pointer}
.fit input{margin-top:3px;accent-color:var(--gold-bright)}
.fit.disabled{opacity:.5;cursor:not-allowed}
.flag{font-size:.84rem;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.flag.ok{background:var(--good-soft);border-left-color:var(--good)}
details.ex{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface-2)}
details.ex summary{cursor:pointer;font-weight:600;font-size:.9rem}
details.ex ul{margin:8px 0 0;padding-left:18px;font-size:.88rem}
details.ex li{margin:4px 0}

/* ---------- Exam lab ---------- */
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:.84rem;font-weight:500}
.dchip[aria-pressed="true"]{background:var(--gold-bright);color:var(--on-gold);border-color:var(--gold-bright);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-bright);color:var(--on-gold)}
.frq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.frq .qno{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.frq .prompt{font-family:var(--f-display);font-size:1.18rem;line-height:1.45;margin-top:6px}
.frq ul{margin:8px 0 0;padding-left:22px}
.frq li{margin:2px 0}
.timer{display:flex;flex-wrap:wrap;max-width:100%;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.timer .clock{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low .clock{color:var(--bad)}
.rubric{display:flex;flex-direction:column;gap:10px}

<script>
/* =====================================================================
   DATA: the 8 Business Canvas Project deliverables that require
   hypothesis testing (CED p. 147, marked with *)
   ===================================================================== */
const DELIVS = [
  {id:'problem', unit:1, comp:'Customer', row:'B', topic:'Topics 1.1, 1.4 · Unit 1 Task 3',
   name:'Identification and validation of a customer problem, need, or want', short:'Customer problem',
   focus:'a customer problem, need, or want', type:'single', behavior:false,
   fit:{best:['survey','interview'], ok:['observation','focus','secondary'], poor:['experiment'], na:['ab']},
   why:'Confirm the problem is real, and common enough among your customers to build a business around, before you spend time or money on a solution.',
   decides:'which customer problem, need, or want to address',
   methodAdvice:'This is about what customers experience, so asking them works well. Interviews tell you why the problem hurts; a survey tells you how common it is. Secondary research can show the problem exists nationally, but it does not prove it for your customers.',
   kw:/problem|need|want|struggl|troubl|hard|frustrat|forget|wish|difficult|annoy|hassle/i,
   examples:['If we survey parents at school pickup, at least 50% will say finding time to cook a healthy weeknight dinner is a weekly struggle.','If we interview 8 student drivers, at least 5 will describe losing track of where they parked in the past month.']},
  {id:'psfit', unit:1, comp:'Product', row:'D', topic:'Topic 1.4 · Unit 1 Task 5',
   name:'Product idea that achieves problem-solution fit', short:'Problem-solution fit',

   fit:{best:['experiment','observation'], ok:['survey','interview'], poor:['focus','secondary'], na:['ab']},
   why:'Show that your solution actually solves the validated problem. The CED is clear that gathering opinions does not qualify here: offer the solution and count what customers do.',
   decides:'your product idea',
   methodAdvice:'Measure behavior. Run a short pilot or offer the product and count purchases or sign-ups. Surveys and interviews can explain why, but people overstate what they would buy.',
   kw:/buy|purchas|sign|order|use|pay|choose|pick|try/i,
   ced:'If students want healthier after-school snacks, then they will purchase hummus and pretzel cups or fresh fruit if those are offered.',
   examples:['If we offer a $2 phone-charging locker at the library for one week, at least 15 students will pay to use it.']},
  {id:'profile', unit:2, comp:'Customer', row:'B', topic:'LO 2.1.B · Unit 2 Task 1',
   name:'Target customer profile', short:'Target customer profile',
   focus:'your target customer profile', type:'ab', behavior:false,
   fit:{best:['survey','interview'], ok:['focus','secondary','observation','ab'], poor:['experiment'], na:[]},
   why:'Not every product is for everyone. Test whether the person in your profile really is the most likely buyer, and be ready to revise the profile if they are not.',
   decides:'who your target customer is',
   methodAdvice:'Talk to people who fit the profile and people who do not, then compare. The CED asks for at least one interview with someone who matches your target customer profile.',
   kw:/customer|parent|student|teen|famil|owner|people|segment|athlete|collector|retire/i,

  {id:'relations', unit:2, comp:'Customer', row:'X', extra:true, topic:'LOs 2.1.C, 2.2.A, 2.2.C · Unit 2 Task 2',

   focus:'a sales tactic or customer relationship tactic', type:'ab', behavior:true,
   fit:{best:['ab','experiment'], ok:['interview','focus','survey','observation'], poor:['secondary'], na:[]},
   why:'Not starred, but the CED asks students to frame their customer-acquisition and customer-retention tactics as hypotheses and test them with interviews, focus groups, or A/B tests. It is great practice, and an FRQ could still ask about it.',
   decides:'which sales or customer relationship tactic to use',
   methodAdvice:'Tactics are about what customers do: buy, come back, refer a friend. An A/B test of two tactics gives behavior data. Interviews and focus groups explain why a tactic does or does not persuade.',
   kw:/offer|loyal|reward|punch|discount|referr|thank|follow|return|repeat|again|tactic|scarc|limited|popular|free|retain|relationship/i,
   ced:'If we offer X, then customers will respond by Y.',
   examples:['If we show a “Most popular” label on our best seller (social proof), at least 30% more customers will choose it.','If we text customers a thank-you photo after each service, at least half will book again within a month.']},
  {id:'prefs', unit:2, comp:'Customer', row:'B', topic:'LO 2.3.C · Unit 2 Task 3',
   name:'Research findings on customer preferences', short:'Customer preferences',
   focus:'customer preferences', type:'ab', behavior:false,
   fit:{best:['interview','survey','focus'], ok:['ab','experiment'], poor:['observation','secondary'], na:[]},
   why:'Find out which features, attributes, or experiences make the product useful and appealing to your target customers.',
   decides:'a product feature in response to customer preferences',
   methodAdvice:'Preferences are opinions, so interviews, surveys, and focus groups fit. Keep questions open-ended and neutral. An A/B test can confirm a preference with real behavior.',
   kw:/prefer|feature|option|choose|want|value|rather|over|more/i,
   ced:'If customers value convenience, then offering a mobile app interface will increase their interest in the product.',
   examples:['If we show target customers a lunch box with an ice pack and one with a built-in fork, more will pick the ice pack version.']},
  {id:'campaign', unit:2, comp:'Customer', row:'B', topic:'LO 2.7.A · Unit 2 Task 8',
   name:'Marketing campaign, including digital marketing tool(s)', short:'Digital marketing tool',
   focus:'a digital marketing tool in your marketing campaign', type:'single', behavior:true,
   fit:{best:['experiment','observation'], ok:['survey','focus'], poor:['interview','secondary'], na:['ab']},
   why:'You must test at least one hypothesis specific to a digital marketing tool, then use the results to improve the campaign.',
   decides:'a digital marketing tool',
   methodAdvice:'Post it and measure what people do: clicks, sign-ups, orders, code redemptions. Platform analytics are observation data. To compare two versions of a post, run an A/B test.',
   kw:/post|ad|video|reel|tiktok|instagram|facebook|email|social|campaign|click|order|follow|sign/i,
   ced:'If we present our product using this campaign, 1 in 10 of our customers will place an order.',

  {id:'mvp', unit:2, comp:'Product', row:'D', topic:'LO 2.4.A · Unit 2 Task 5',

const DMAP = Object.fromEntries(DELIVS.map(d=>[d.id,d]));
const STARRED = DELIVS.filter(d=>!d.extra);
const mark = d => d.extra ? '<span class="xtra">extra</span>' : '<span class="star">*</span>';
function starDone(r){ return STARRED.filter(d=>r.missions?.[d.id]?.done).length; }
const ROWNAME = {B:'Row B · Hypothesis Testing of Customer Component Elements', D:'Row D · Hypothesis Testing of Product Component Elements', I:'Row I · Hypothesis Testing of Pricing Strategy', X:'Not starred on p. 147 · hypothesis testing recommended in Unit 2 Task 2'};

/* Deliverables chart (CED p. 147). Items starting with @ are hypothesis-testing deliverables. */
const MAPROWS = [
  {cls:'cust', name:'Customer', u:[['@problem'],['@profile','@relations','@prefs','@campaign'],[],['Key performance indicators (KPIs) for customer-related goal(s)']]},
  {cls:'prod', name:'Product', u:[['@psfit'],['@mvp','Value proposition','@brand'],[],[]]},
  {cls:'org', name:'Organization', u:[['Vision statement','Mission statement'],[],[],['Skills assessment','Strategic decision using PACED model']]},
  {cls:'ops', name:'Operations', u:[['Supply chain plan, including process(es) for producing the good or service'],['Marketing channel(s)'],[],['KPI(s) for operations-related goal(s)']]},
  {cls:'mkt', name:'Market', u:[['Plan to seek competitive advantage','PESTEL analysis'],['Research findings on competitive landscape'],[],['KPI(s) for market-related goal(s)','Framework analysis of market using Porter’s Five Forces and/or SWOT analysis']]},

/* =====================================================================

   ===================================================================== */
const BIZ = [
  {id:'crumb', name:'Crumb Cart', ini:'CC', tag:'Healthy grab-and-go snacks sold from a cart after school',

   featA:'a build-your-own snack box', featB:'ready-made snack combos', brandA:'Crumb Cart (hand-drawn logo)', brandB:'FuelStop (bold athletic logo)',

/* Horizontal bar chart drawn to one scale. bars:[{label,v,display}] v in [0,max] */
function barChart(bars, {max=1, threshold=null, thLabel='', fmt=v=>pct(v)}={}){
  const W=560, L=8, R=70, barH=24, gap=40, top=26;
  const H = top + bars.length*(barH+gap) + 12;
  const sx = v => L + (W-L-R) * (v/max);
  let g = '';
  const ticks = [0,.25,.5,.75,1].map(f=>f*max);
  ticks.forEach(t=>{ const x=sx(t); g+=`<line x1="${x}" y1="${top-6}" x2="${x}" y2="${H-8}" stroke="var(--line)" stroke-width="1"/><text x="${x}" y="${top-12}" font-size="10" font-family="var(--f-mono)" fill="var(--muted)" text-anchor="${t===0?'start':(t===max?'end':'middle')}">${esc(fmt(t))}</text>`; });
  bars.forEach((b,i)=>{
    const y = top + i*(barH+gap) + 16;
    g += `<text x="${L}" y="${y-6}" font-size="12.5" font-family="var(--f-body)" font-weight="600" fill="var(--ink)">${esc(b.label)}</text>`;
    g += `<rect x="${L}" y="${y}" width="${Math.max(2,sx(clamp(b.v,0,max))-L)}" height="${barH}" rx="4" fill="${b.color||'var(--gold-bright)'}"/>`;
    g += `<text x="${sx(clamp(b.v,0,max))+6}" y="${y+barH/2+4}" font-size="12" font-family="var(--f-mono)" font-weight="600" fill="var(--ink)">${esc(b.display ?? fmt(b.v))}</text>`;
  });
  if(threshold!=null){ const x=sx(threshold); g+=`<line x1="${x}" y1="${top-2}" x2="${x}" y2="${H-8}" stroke="var(--navy-2)" stroke-width="2" stroke-dasharray="5 4"/><rect x="${clamp(x-46,0,W-92)}" y="${H-20}" width="92" height="16" rx="3" fill="var(--surface)"/><text x="${clamp(x,46,W-46)}" y="${H-8}" font-size="10.5" font-family="var(--f-mono)" fill="var(--ink)" text-anchor="middle">${esc(thLabel)}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H+8}" role="img" aria-label="Bar chart of results">${g}</svg>`;
}

function variants(b,d){

function shuffleStable(arr, seed){ let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))|0; return (h&1)?arr:[...arr].reverse(); }

/* --- the simulation engine --- */
function runTest(){
  const b=BMAP[S.sim.biz], d=DMAP[S.sim.mission], m=mission(d.id), r=run(), ds={...m.design};
  const meth=METHODS[ds.method]; const tier=meth.tiers[Math.min(ds.tier,meth.tiers.length-1)];
  if(r.credits<tier.c) return;
  r.credits -= tier.c;
  const truth = r.truths[d.id];
  const data = {method:ds.method, n:tier.n, who:ds.who, wording:meth.kind==='opinion'?ds.wording:null};
  if(ds.method==='secondary'){
    const base = Array.isArray(truth) ? (truth[0]+truth[1])/2 : truth;
    data.secondary = clamp(Math.round((base + (Math.random()-.5)*.24)*100), 4, 95);
  } else {
    const adj = (p, favored)=>{
      if(meth.kind==='opinion' && d.behavior) p = Math.min(.95, p*1.6+.05);
      if(meth.kind==='opinion' && ds.wording==='leading') p = favored ? p+.18 : p-.04;
      if(ds.who==='friends') p = favored ? p + (meth.kind==='opinion'?.13:.06) : p;
      if(ds.who==='public') p = p*.55;
      return clamp(p,.01,.97);
    };
    if(d.type==='single'){
      let p = adj(truth, true);
      let k=0; const n=tier.n;
      if(ds.method==='focus'){ const groups=n/8; for(let g=0;g<groups;g++){ k+=binom(8, clamp(p+gauss()*.12,.01,.97)); } }
      else k=binom(n,p);
      data.k=k;
    } else {
      const each = meth.qual ? tier.n : Math.floor(tier.n/2);
      data.each = each;
      data.k = [0,1].map(i=>{ let p=adj(truth[i], i===m.win); if(ds.method==='focus'){ let k=0; for(let g=0;g<tier.n/8;g++) k+=binom(8, clamp(p+gauss()*.12,.01,.97)); return k; } return binom(each,p); });
    }
    if(meth.qual) data.quotes = makeQuotes(b,d,m,data);
  }
  const ev = evaluate(b,d,m,data);
  m.cur = {design:ds, data, expected:ev.expected, issues:ev.issues, stats:ev.stats, interp:null, decision:null};
  m.step='results'; save(); render(); window.scrollTo({top:0});
}
function makeQuotes(b,d,m,data){
  const out=[];
  if(d.type==='single'){
    const pool=QUOTES[d.id]||QUOTES.psfit; const pos=data.k, neg=data.n-data.k;
    const P=shuffle(pool.pos), N=shuffle(pool.neg);
    for(let i=0;i<Math.min(pos,3);i++) out.push({pos:true,t:P[i%P.length]});
    for(let i=0;i<Math.min(neg,2);i++) out.push({pos:false,t:N[i%N.length]});
  } else {
    const v=variants(b,d);
    [0,1].forEach(i=>{ const P=shuffle(QUOTES.ab.pos), N=shuffle(QUOTES.ab.neg);
      if(data.k[i]>0) out.push({pos:true,t:fill(P[0],{X:v[i]})});
      if(data.each-data.k[i]>0) out.push({pos:false,t:fill(N[0],{X:v[i]})}); });
  }

function profitPer100(b,i,rate){ const price=i===0?b.priceA:b.priceB; return rate*(price-b.cost)*100; }
function evaluate(b,d,m,data){
  const meth=METHODS[data.method]; const issues=[];
  const fit = d.fit.best.includes(data.method)?'best':d.fit.ok.includes(data.method)?'ok':'poor';
  if(data.method==='secondary') issues.push('secondary');
  else {
    if(meth.kind==='opinion' && d.behavior) issues.push('saydo');
    if(fit==='poor') issues.push('poorfit');
    if(meth.kind==='opinion' && data.wording==='leading') issues.push('leading');
    if(data.who==='friends') issues.push('friends');
    if(data.who==='public') issues.push('public');
    if(data.n < meth.min) issues.push('small');
  }
  const stats={};

    if(d.type==='single'){

      stats.moe = meth.qual ? .12 : 1.96*Math.sqrt(Math.max(p,.05)*(1-Math.min(p,.95))/data.n);
      const T=m.T/100;
      stats.verdict = p>=T+stats.moe ? 'supported' : p<T-stats.moe ? 'refuted' : 'inconclusive';
      // within margin but on correct side: still inconclusive by design

        const se = 100*Math.sqrt(mar[0]**2*Math.max(p[0],.05)*(1-p[0])/n + mar[1]**2*Math.max(p[1],.05)*(1-p[1])/n);

      } else {

        stats.moe = meth.qual ? .12 : 1.96*se;
        const diff=p[m.win]-p[1-m.win]; stats.diff=diff;
        stats.verdict = diff>stats.moe?'supported':diff<-stats.moe?'refuted':'inconclusive';

function evidenceLine(b,d,m,M,tk,data,short){

  if(d.type==='single') return short ? `${data.k} of ${data.n} (${pct(data.k/data.n)})` : `${data.k} of ${data.n} (${pct(data.k/data.n)}) ${metric}.`;
  const v=variants(b,d), n=data.each;
  let s = `${v[0]}: ${data.k[0]} of ${n} (${pct(data.k[0]/n)}); ${v[1]}: ${data.k[1]} of ${n} (${pct(data.k[1]/n)})`;
  if(d.type==='price'){ const pr=[0,1].map(i=>profitPer100(b,i,data.k[i]/n)); s += short ? '' : ` ${metric}. Gross profit per 100 potential customers: ${v[0]} ${money(pr[0])} vs. ${v[1]} ${money(pr[1])}.`; return short? s : s; }

function stepDecide(b,d,m,M,tk,r){

const DEC_FOR = {supported:'persevere', refuted:'pivot', inconclusive:'retest'};
function finalize(){
  const b=BMAP[S.sim.biz], d=DMAP[S.sim.mission], m=mission(d.id);
  const c=m.cur;
  if(c.decision==='retest'){
    m.attempts.push(c); m.cur=null; m.step='design'; save(); render(); window.scrollTo({top:0});
    toast(c.expected==='inconclusive' ? 'Good call. That data was not trustworthy.' : 'Retesting. Note: that data was actually solid.');
    return;
  }
  m.attempts.push(c);
  const ev = evaluate(b,d,m,c.data);
  const hyp = (m.firstH==='good'?15:5) + (d.type==='single' ? (m.T>=b.bench[d.id]?5:0) : 5);
  const method = ev.fit==='best'?20:ev.fit==='ok'?12:4;

  const sample = c.data.method==='secondary' ? 8 : Math.max(0, 20 - 7*sampleIss.length);

  const decision = c.decision===DEC_FOR[c.expected] ? 20 : 0;

function chainFor(b,d,m){

  if(d.type==='single'){ const real = truth*100 >= m.T; reality = `Behind the curtain, the true rate among ${esc(b.customer)} was <b>${pct(truth)}</b>, so your hypothesis was really <b>${real?'true':'false'}</b>.`; }
  else if(d.type==='price'){ const pr=[0,1].map(i=>profitPer100(b,i,truth[i])); const w=pr[0]>=pr[1]?0:1; reality = `Behind the curtain, true buying rates were ${v[0]} <b>${pct(truth[0])}</b> and ${v[1]} <b>${pct(truth[1])}</b>, so <b>${esc(v[w])}</b> really earns more (${money(pr[0])} vs. ${money(pr[1])} per 100). Your pick was ${w===m.win?'right':'wrong'}.`; }
  else { const diff=Math.abs(truth[0]-truth[1]); const w=truth[0]>=truth[1]?0:1; reality = `Behind the curtain, true response rates were ${esc(v[0])} <b>${pct(truth[0])}</b> and ${esc(v[1])} <b>${pct(truth[1])}</b>. ${diff<.05?'They are nearly tied, so a fair test should come out inconclusive unless the sample is very large.':`<b>${esc(v[w])}</b> really wins. Your pick was ${w===m.win?'right':'wrong'}.`}`; }
  const ch=chainFor(b,d,m);
  const fitTxt = {best:'Strong fit for this hypothesis.', ok:'Workable, but not the strongest choice.', poor:'Weak fit for this hypothesis.'}[s.fit];
  const bestNames = d.fit.best.map(k=>METHODS[k].name).join(' or ');
  return `<div class="grid2"><div class="stack">
   <div class="card stack"><div class="eyebrow">Mission debrief</div><h3>${s.total} / 100</h3>
    <div class="scorebar">
     <span>Hypothesis ${m.firstH==='good'?'(first try)':'(needed a retry)'}${d.type==='single'&&m.T<b.bench[d.id]?' · prediction set below the mentor’s benchmark':''}</span><span class="pts">${s.hyp}/20</span>
     <span>Method: ${esc(METHODS[c.data.method].name)}. ${fitTxt}${s.fit!=='best'?` Best here: ${esc(bestNames)}.`:''}</span><span class="pts">${s.method}/20</span>
     <span>Sample and wording</span><span class="pts">${s.sample}/20</span>
     <span>Interpretation: you said ${c.interp==='refuted'?'not supported':c.interp}; the evidence was ${c.expected==='refuted'?'not supported':c.expected}</span><span class="pts">${s.interp}/20</span>
     <span>Decision: ${c.decision}; the evidence called for ${DEC_FOR[c.expected]}</span><span class="pts">${s.decision}/20</span>
     ${s.retestPenalty?`<span>Retests that were not needed</span><span class="pts">−${s.retestPenalty}</span>`:''}
    </div></div>

   <div class="note small">${reality} Real markets are noisy (EK 2.3.C.9), so a fair test can still miss now and then. What earns points is a sound process.</div>
   <div class="card stack"><div class="eyebrow">Your evidence chain · four-part format</div>${(s.interp===0||s.decision===0||c.issues.length)?'<div class="note warn small">This chain records a flawed test. Use it to spot what went wrong, not as a model answer. Replay the mission to earn a clean one.</div>':''}
    <div class="chain-out"><div><b>Hypothesis</b>${esc(ch.H)}</div><div><b>Method</b>${esc(ch.M)}</div><div><b>Evidence</b>${esc(ch.E)}</div><div><b>Decision</b>${esc(ch.D)}</div></div>
    <div class="row"><button class="btn" data-act="copychain">Copy</button><button class="btn primary" data-act="goto-exam" data-id="${d.id}">Write this up in the Exam Practice Lab</button></div></div>

function item(id){ if(!S.builder.items[id]) S.builder.items[id]={ifPart:'',thenWho:'',willDo:'',target:'',methods:[],who:'',n:'',questions:'',mode: DMAP[id].type==='single'?'single':'ab', ev:{n:'',k:'',T:'',la:'',na:'',ka:'',lb:'',nb:'',kb:'',win:'a'}, notes:'', decType:'', decText:''}; return S.builder.items[id]; }
function hypSentence(it){
  const a=(it.ifPart||'').trim(), w=(it.thenWho||'').trim(), x=(it.willDo||'').trim(), t=(it.target||'').trim();
  if(!a && !w && !x && !t) return '';
  return `If ${a||'___'}, then ${w||'___'} will ${x||'___'}${t?' '+t:''}.`.replace(/\.\.$/,'.');
}
function hypChecks(id, it){
  const d=DMAP[id], s=hypSentence(it), all=[it.ifPart,it.thenWho,it.willDo,it.target].join(' ');
  return [
    {ok: !!s && !/\?/.test(all) && !!(it.ifPart||'').trim(), label:'States a prediction, not a question', tip:'Remove question marks. Say what you expect to happen.'},
    {ok: (it.thenWho||'').trim().length>2, label:'Names who (a customer or group)', tip:'Who will respond? Use your target customer.'},
    {ok: /buy|purchas|sign|pre-?order|order|choose|chose|pick|prefer|click|tap|subscri|pay|return|come back|book|use|say|report|rate|redeem|share|visit|download|join|want/i.test(it.willDo||''), label:'Predicts an observable response', tip:'Use an action you can count: buy, choose, sign up, say, click.'},
    {ok: /\d|half|majority|more than|fewer|higher|lower|twice|double|most/i.test((it.target||'')+' '+(it.willDo||'')), label:'Is measurable (a number or comparison)', tip:'Add a target such as “at least 30%” or “more than option B.”'},
    {ok: !!s && !/\b(everyone|everybody|love|best|huge|viral|success|amazing|awesome|perfect|always|never)\b/i.test(all), label:'Avoids vague or untestable words', tip:'Swap words like “everyone,” “love,” or “viral” for something measurable.'},
    {ok: d.kw.test(all), label:`Connects to ${d.short.toLowerCase()}`, tip:`Make sure the hypothesis is about ${d.focus}.`}
  ];
}
function biasFlags(text){
  const out=[];
  (text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const f=[];
    if(/\b(don'?t|doesn'?t|wouldn'?t|isn'?t|aren'?t|won'?t|can'?t) (you|it|this|they)\b|, right\?|\bright\?$/i.test(l)) f.push('Leading: it signals the answer you want.');
    if(/\b(love|amazing|awesome|great deal|obviously|clearly|best|hate|terrible)\b/i.test(l)) f.push('Loaded words can push answers one way.');
    if(/^(do|does|did|would|will|is|are|can|could|have|has|should)\b/i.test(l)) f.push('Yes/no question. Try “How…,” “What…,” or “Tell me about…” for richer answers.');
    if(/\?.*\?/.test(l) || (/\band\b/i.test(l) && /\?$/.test(l) && l.split(' ').length>14)) f.push('Might be asking two things at once.');
    out.push({q:l, f});
  });
  return out;
}
function fitOf(d,k){ return d.fit.best.includes(k)?'best':d.fit.ok.includes(k)?'ok':d.fit.na.includes(k)?'na':'poor'; }
function evStats(it){
  const ev=it.ev||{};
  const qual = (it.methods||[]).length>0 && (it.methods||[]).every(k=>METHODS[k]?.qual);
  if(it.mode==='single'){
    const n=+ev.n, k=+ev.k, T=+ev.T; if(!(n>0) || !(k>=0) || k>n) return null;
    const p=k/n; const moe = qual?.12:1.96*Math.sqrt(Math.max(p,.05)*(1-Math.min(p,.95))/n);
    let verdict=null; if(ev.T!=='' && T>=0){ const t=T/100; verdict = p>=t+moe?'supported':p<t-moe?'refuted':'inconclusive'; }
    return {p,moe,verdict,n,k,T, small:n<(qual?5:30)};
  } else {
    const na=+ev.na, ka=+ev.ka, nb=+ev.nb, kb=+ev.kb; if(!(na>0&&nb>0) || ka>na || kb>nb || ka<0 || kb<0) return null;
    const pa=ka/na, pb=kb/nb; const se=Math.sqrt(Math.max(pa,.05)*(1-pa)/na + Math.max(pb,.05)*(1-pb)/nb); const moe = qual?.12:1.96*se;
    const diff = ev.win==='a' ? pa-pb : pb-pa;
    return {pa,pb,moe,diff,verdict: diff>moe?'supported':diff<-moe?'refuted':'inconclusive', small: Math.min(na,nb)<(qual?5:30)};
  }
}
function builderChain(id){
  const d=DMAP[id], it=item(id), st=evStats(it), ev=it.ev;
  const H = hypSentence(it) || '(not written yet)';
  const meth = (it.methods||[]).map(k=>METHODS[k].name).join(' and ');
  const M = meth ? `${meth}${it.n?` with ${it.n}`:''}${it.who?` ${it.who}`:''}.` : '(not chosen yet)';
  let E='(no evidence logged yet)';
  if(st){ E = it.mode==='single' ? `${st.k} of ${st.n} (${pct(st.p)}) responded as predicted.` : `${ev.la||'Option A'}: ${ev.ka} of ${ev.na} (${pct(st.pa)}); ${ev.lb||'Option B'}: ${ev.kb} of ${ev.nb} (${pct(st.pb)}).`; }
  if((it.notes||'').trim()) E += ' ' + it.notes.trim().split(/\n/)[0];
  const D = (it.decText||'').trim() || '(decision not recorded yet)';
  return {H,M,E,D};
}

function verdictNote(st){
  const v=st.verdict; if(!v) return '<p class="small muted">Add your predicted percentage to compare.</p>';
  const txt = v==='supported'?'Your evidence supports the hypothesis.':v==='refuted'?'Your evidence does not support the hypothesis. That is useful: it tells you what to change.':'Too close to call. The difference is within the margin of error, so consider a larger sample or a second method.';
  return `<div class="note ${v==='supported'?'good':v==='refuted'?'bad':'warn'} small">${txt} <span class="muted">(Margin of error about ±${Math.round(st.moe*100)} points.)</span>${st.small?' Your sample is small, so treat this result with caution.':''}</div>`;

    evidence: /\d/.test(t) || /\b(most|majority|half|more|fewer|nobody|none of|all of)\b.*\b(people|customers|respondents|students|participants|visitors|testers|families)\b/i.test(t),
    decision: /(decid|chose|choose|switch|chang|kept|keep|drop|revis|pivot|went with|added|removed|narrow|lower(ed)? (the|my|our)|rais|redesign|set (the|my|our) price)/i.test(t) && /(because|since|so |based on|due to|as a result|after (seeing|learning)|which (showed|meant)|showed)/i.test(t)
  };
}

  box.innerHTML = BOT.msgs.map(m=>`<div class="bmsg ${m.role}">${m.html}${m.extra||''}</div>`).join('') + (BOT.msgs.length<=1 ? `<div class="bchips">${BOT_START.map(q=>`<button class="bchip" data-act="botask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : '');
  box.scrollTop=box.scrollHeight;
}
function toggleBot(force){
  BOT.open = force!=null ? force : !BOT.open;
  $('#botPanel').hidden=!BOT.open; $('#botBtn').setAttribute('aria-expanded', BOT.open);
  if(BOT.open){ if(!BOT.msgs.length) botPush('bot', mdLite('Hi! I’m the Lab Assistant. Ask me about hypothesis testing, your Business Canvas Project, the FRQs, or how to use this app. Tap a question to start.')); botAI(); setTimeout(()=>$('#botInput')?.focus(), 50); }
}
async function botAsk(q){
  q=(q||'').trim(); if(!q || BOT.busy) return;
  botPush('me', '<p>'+esc(q)+'</p>'); $('#botInput').value='';
  const m=faqMatch(q);
  const ai = await botAI();
  const words=q.split(/\s+/).length;
  if(m.f && (m.score>=5 || (m.score>=3 && words<=6) || !ai)){
    botPush('bot', mdLite(m.f.a)); BOT.turns.push({role:'user',content:q},{role:'assistant',content:m.f.a.replace(/\*\*/g,'')}); return;
  }
  if(!ai){
    botPush('bot', mdLite(m.f ? m.f.a : 'I don’t have a ready answer for that one. Try one of the questions below, or ask your teacher.'), m.f?'':`<div class="bchips">${BOT_START.map(x=>`<button class="bchip" data-act="botask" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`);
    return;
  }
  BOT.busy=true; $('#botStop').hidden=false; $('#botSend').disabled=true;
  BOT.msgs.push({role:'bot', html:'<p class="muted">Thinking…</p>'}); renderBotMsgs();
  const idx=BOT.msgs.length-1; BOT.ctl=new AbortController();
  BOT.turns.push({role:'user', content:q}); const turns=BOT.turns.slice(-10);
  try{
    const {text} = await ai([{role:'user', content:botRules()}, ...turns], {modelTier:'quick', cache:false, signal:BOT.ctl.signal,
      onText:({text})=>{ BOT.msgs[idx].html=mdLite(text); renderBotMsgs(); }});
    BOT.msgs[idx].html=mdLite(text); BOT.turns.push({role:'assistant', content:text});
  }catch(e){
    const c=e&&e.code; BOT.turns.pop();
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','session_expired'].includes(c)){ BOT.ai=null; renderBotMode(); }
    const fb = m.f ? m.f.a : null;
    const msg = c==='cancelled' ? (e.text||'Stopped.') : c==='rate_limited' ? 'I’m getting a lot of questions right now. Wait a minute and try again.' : c==='refused' ? 'I can’t help with that one. Try asking about hypothesis testing, your Business Canvas Project, or the FRQs.' : (fb ? fb : (BOT.ai ? 'Something went wrong on my end. Try asking again in a moment.' : 'AI answers are not available here, so I can only answer the common questions below.'));
    BOT.msgs[idx].html = mdLite(msg); if(!BOT.ai && !fb) BOT.msgs[idx].extra = `<div class="bchips">${BOT_START.map(x=>`<button class="bchip" data-act="botask" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
  } finally { BOT.busy=false; $('#botStop').hidden=true; $('#botSend').disabled=false; renderBotMsgs(); }
}

function starC(){ return new Set(S.exam.history.map(h=>h.d).filter(id=>DMAP[id] && !DMAP[id].extra)).size; }
function partBEarned(){ return Object.entries(S.exam.self).filter(([k,v])=>k.startsWith('B:') && v===1).length; }
function checkBadges(silent){
  const fresh=[];
  for(const bd of BADGES){ let ok=false; try{ ok=bd.test(); }catch(e){} if(ok && !S.badges[bd.id]){ S.badges[bd.id]=Date.now(); fresh.push(bd.name); } }
  if(fresh.length){ updateBadgeCount(); if(!silent) toast((fresh.length>1?'Badges earned: ':'Badge earned: ')+fresh.join(', ')); if(S.tab==='report') render(); }

function updateBadgeCount(){ const el=$('#badgeCount'); if(el) el.textContent = Object.keys(S.badges).filter(k=>BADGES.some(b=>b.id===k)).length; }
const SEAL = (()=>{ const pts=[]; const n=16; for(let i=0;i<n*2;i++){ const a=Math.PI*i/n - Math.PI/2; const r = i%2 ? 26.5 : 30; pts.push((32+r*Math.cos(a)).toFixed(2)+' '+(32+r*Math.sin(a)).toFixed(2)); } return 'M'+pts.join(' L')+' Z'; })();
function badgeSVG(bd, on){
  const fs = bd.code.length>=3 ? 12.5 : 16;
  return `<svg viewBox="0 0 64 64" width="54" height="54" aria-hidden="true"><path d="${SEAL}" fill="${on?'var(--navy)':'var(--surface-2)'}" stroke="${on?'var(--gold-bright)':'var(--line)'}" stroke-width="1.5" ${on?'':'stroke-dasharray="3 3"'}/><circle cx="32" cy="32" r="20" fill="none" stroke="${on?'var(--gold-bright)':'var(--line)'}" stroke-width="1"/><text x="32" y="${32+fs*0.36}" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="${fs}" fill="${on?'var(--gold-bright)':'var(--muted)'}">${esc(bd.code)}</text></svg>`;
}

  runs.forEach(b=>{ const r=S.sim.runs[b.id], n=starDone(r), t=runTotal(r);
    ensure(40); para(`${b.name}: ${t} / 800 points, ${n} of 8 missions${n===8?' - '+gradeFor(t):''}`,{style:'bold',size:10.5,gap:2});
    DELIVS.forEach(d=>{ const m=r.missions[d.id]; if(!m?.done) return; ensure(14); doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(pdfClean(d.short), M+12, y+9); doc.setFont('courier','bold'); doc.text(`${m.score.total}/100`, W-M, y+9, {align:'right'}); doc.setDrawColor(...LINE); doc.setLineWidth(.4); doc.line(M+12, y+13, W-M, y+13); y+=15; });
    y+=8; });
  // exam lab
  heading('FRQ 1 practice (Exam Practice Lab)');
  para(`Part B points earned: ${partBEarned()}.  Best Point or No Point round: ${S.exam.drillBest?S.exam.drillBest+' of 25':'not completed'}.  Part C attempts saved: ${S.exam.history.length}.`,{size:9.5,gap:8});
  let anyC=false;
  DELIVS.forEach(d=>{ const t=(S.exam.drafts['C:'+d.id]||'').trim(); if(!t) return; anyC=true; const sf=S.exam.self['C:'+d.id]||{}; const sc=Object.values(sf).filter(v=>v===1).length;
    ensure(60); lab(`Part C - ${d.short} - self-score ${sc}/4`);
    para(`Explain how you tested a hypothesis about ${d.focus} in your Business Canvas Project.`,{size:9,style:'italic',color:MUTED,gap:3});
    para(t,{size:9.5,gap:10}); });
  if(!anyC) para('No Part C responses written yet.',{color:MUTED});
  let anyF3=false;
  FRQ3.forEach(sc=>{ const parts=F3PARTS.map(pt=>({pt, t:(S.exam.drafts[`F3:${sc.id}:${pt.k}`]||'').trim()})); if(!parts.some(x=>x.t)) return; if(!anyF3){ heading('FRQ 3 practice: Business Concept Application'); anyF3=true; }
    const sf=(S.exam.self && S.exam.f3self && S.exam.f3self[sc.id])||{}; const scv=Object.values(sf).filter(v=>v===1).length;
    ensure(50); lab(`FRQ 3 - ${sc.name} (${sc.short}) - self-score ${scv}/3`);
    parts.forEach(({pt,t})=>{ para(`(${pt.k}) ${fill(pt.p,{name:sc.name})}`,{size:9,style:'italic',color:MUTED,gap:2}); para(t||'(no response)',{size:9.5,color:t?INK:MUTED,gap:6}); }); y+=4; });
  // footers
  const np=doc.getNumberOfPages();
  for(let i=1;i<=np;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(pdfClean(`Hypothesis Lab report - ${name}`), M, H-26); doc.text(`Page ${i} of ${np}`, W-M, H-26, {align:'right'}); }
  return doc;
}
let pdfBusy=false;
async function savePDF(btn){
  if(pdfBusy) return; pdfBusy=true;
  try{
    const doc=buildPDF();
    if(!doc){ toast('The PDF tool did not load. Check your internet connection and reload the page.'); return; }
    const blob=doc.output('blob');
    const slug=(S.report.name||'student').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'student';
    const filename=`hypothesis-lab-report-${slug}.pdf`;
    let dl=null; try{ dl = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('downloads') : null; }catch(e){ dl=null; }
    if(dl){
      try{ await dl.save({filename, data:blob}); toast('PDF saved'); }
      catch(e){ const c=e&&e.code; toast(c==='declined'?'Save canceled':c==='rate_limited'?'A save prompt is already open':'Saving files is not available in this view'); }
      return;
    }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); toast('PDF downloaded');
  } finally { pdfBusy=false; }
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a=el.dataset.act, id=el.dataset.id, k=el.dataset.k;
  const b = S.sim.biz ? BMAP[S.sim.biz] : null;
  switch(a){
    case 'tab': setTab(el.dataset.tab); break;
    case 'bot': toggleBot(); break;
    case 'botask': if(!BOT.open) toggleBot(true); botAsk(el.dataset.q); break;
    case 'botstop': BOT.ctl?.abort(); break;
    case 'mapsel': S.mapSel=id; save(); render(); break;
    case 'goto-builder': S.builder.sel=id; setTab('builder'); break;
    case 'goto-exam': S.exam.d=id; S.exam.mode='C'; S.exam.showModel=false; setTab('examlab'); break;
    case 'goto-sandbox': S.sim.pendingMission=id; if(S.sim.biz && S.sim.runs[S.sim.biz]){ S.sim.mission=id; S.sim.pendingMission=null; } else { S.sim.mission=null; } setTab('sandbox'); if(!S.sim.biz) toast('Pick a startup first'); break;
    case 'pickbiz': S.sim.biz=id; if(!S.sim.runs[id]) S.sim.runs[id]=newRun(id); S.sim.mission = S.sim.pendingMission || null; S.sim.pendingMission=null; save(); render(); break;
    case 'backbiz': S.sim.biz=null; S.sim.mission=null; save(); render(); break;
    case 'resetbiz': {
      if(el.dataset.confirm==='0'){ $('#confirmReset').innerHTML = `<div class="note bad" style="margin-bottom:16px"><b>Restart ${esc(b.name)}?</b> Your missions and score for this startup will be erased, and the hidden data will change. <div class="row" style="margin-top:8px"><button class="btn sm" data-act="resetbiz" data-confirm="1">Yes, restart</button><button class="btn sm" data-act="cancelreset">Cancel</button></div></div>`; break; }
      S.sim.runs[S.sim.biz]=newRun(S.sim.biz); S.sim.mission=null; save(); render(); toast('New hidden data loaded'); break; }
    case 'cancelreset': $('#confirmReset').innerHTML=''; break;
    case 'openmission': S.sim.mission=id; save(); render(); window.scrollTo({top:0}); break;
    case 'closemission': S.sim.mission=null; save(); render(); window.scrollTo({top:0}); break;
    case 'pickh': { const m=mission(S.sim.mission); m.pickH=k; if(!m.firstH) m.firstH=k; save(); render(); break; }
    case 'pickwin': { const m=mission(S.sim.mission); m.win=+el.dataset.i; save(); render(); break; }
    case 'lockhyp': { const m=mission(S.sim.mission); m.step='design'; save(); render(); window.scrollTo({top:0}); break; }
    case 'pickmethod': { const m=mission(S.sim.mission); m.design.method=k; const mm=METHODS[k]; m.design.tier=Math.min(m.design.tier, mm.tiers.length-1); save(); render(); break; }
    case 'picktier': { const m=mission(S.sim.mission); m.design.tier=+el.dataset.i; save(); render(); break; }
    case 'pickwho': { const m=mission(S.sim.mission); m.design.who=k; save(); render(); break; }
    case 'pickword': { const m=mission(S.sim.mission); m.design.wording=k; save(); render(); break; }
    case 'runtest': runTest(); break;
    case 'loan': { const r=run(); r.credits+=3; r.loans=(r.loans||0)+1; save(); render(); toast('Loan approved: +3 credits'); break; }
    case 'interp': { const m=mission(S.sim.mission); m.cur.interp=k; save(); render(); break; }
    case 'todecide': { const m=mission(S.sim.mission); m.step='decide'; save(); render(); window.scrollTo({top:0}); break; }
    case 'decide': { const m=mission(S.sim.mission); m.cur.decision=k; save(); render(); break; }
    case 'finalize': finalize(); break;
    case 'copychain': { const d=DMAP[S.sim.mission]; copyText(chainText(chainFor(b,d,mission(d.id)))); break; }
    case 'nextmission': { const i=DELIVS.findIndex(x=>x.id===S.sim.mission); const r=run(); const nxt=DELIVS.slice(i+1).concat(DELIVS.slice(0,i)).find(x=>!r.missions[x.id]?.done); S.sim.mission = nxt? nxt.id : null; save(); render(); window.scrollTo({top:0}); break; }
    case 'replaymission': { delete run().missions[S.sim.mission]; save(); render(); window.scrollTo({top:0}); break; }
    case 'copylog': { const r=run(); copyText(DELIVS.filter(d=>r.missions[d.id]?.done).map(d=>`${d.name}${d.extra?' (extra)':'*'}\n`+chainText(chainFor(b,d,r.missions[d.id]))).join('\n\n')); break; }
    /* builder */
    case 'bsel': S.builder.sel=id; save(); render(); break;
    case 'bmode': item(S.builder.sel).mode=k; save(); render(); break;
    case 'bdec': item(S.builder.sel).decType=k; save(); $$('[data-act="bdec"]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.k===k)); builderLive(); break;
    case 'copybchain': copyText(chainText(builderChain(S.builder.sel))); break;
    case 'copyall': { const P=S.builder.profile; copyText(`${P.biz||'My business'}: hypothesis testing evidence for the Business Canvas Project\n\n`+DELIVS.map(d=>`${d.name}${d.extra?' (extra)':'*'}\n`+chainText(builderChain(d.id))).join('\n\n')); break; }
    case 'loadexample': loadExample(); break;
    case 'backup': { const box=$('#backupBox'); if(box.innerHTML){ box.innerHTML=''; break; } box.innerHTML = `<div class="card stack" style="margin-bottom:20px"><div class="eyebrow">Back up or restore</div><p class="small">Copy this code and keep it somewhere safe (email it to yourself or paste it into a doc). To restore, paste a code into the box and select Restore.</p><textarea id="backupText" style="min-height:110px;font-family:var(--f-mono);font-size:.78rem">${esc(JSON.stringify({v:1, builder:S.builder, exam:{history:S.exam.history, drafts:S.exam.drafts, f3hist:S.exam.f3hist||[]}}))}</textarea><div class="row"><button class="btn" data-act="copybackup">Copy code</button><button class="btn primary" data-act="restore">Restore from the box</button></div><div id="restoreMsg"></div></div>`; break; }
    case 'copybackup': copyText($('#backupText').value); break;
    case 'restore': { try{ const o=JSON.parse($('#backupText').value); if(!o.builder) throw 0; S.builder=deepMerge(blankState().builder, o.builder); if(o.exam){ S.exam.history=o.exam.history||[]; S.exam.drafts=o.exam.drafts||{}; S.exam.f3hist=o.exam.f3hist||[]; } save(); render(); toast('Restored'); }catch(err){ $('#restoreMsg').innerHTML='<div class="note bad small">That code could not be read. Paste the whole code exactly as you copied it.</div>'; } break; }
    /* exam */
    case 'esel': S.exam.d=id; S.exam.bIdx=0; S.exam.revealB=false; S.exam.showModel=false; save(); render(); break;
    case 'emode': S.exam.mode=k; save(); render(); break;
    case 'reveal-b': S.exam.revealB=!S.exam.revealB; save(); render(); break;
    case 'next-b': S.exam.bIdx++; S.exam.revealB=false; save(); render(); break;
    case 'selfb': S.exam.self[el.dataset.k]=+el.dataset.v; save(); render(); break;
    case 'selfc': { const key='C:'+S.exam.d; S.exam.self[key]=S.exam.self[key]||{}; S.exam.self[key][el.dataset.row]=+el.dataset.v; save(); render(); break; }
    case 'savec': { const key='C:'+S.exam.d, t=S.exam.drafts[key]||''; if(!t.trim()){ toast('Write a response first'); break; } const pc=preCheck(t); const sf=S.exam.self[key]||{}; S.exam.history.push({d:S.exam.d, t:Date.now(), words:(t.trim().match(/\S+/g)||[]).length, pre:Object.values(pc).filter(Boolean).length, self:Object.values(sf).filter(v=>v===1).length}); save(); render(); toast('Attempt saved'); break; }
    case 'showmodel': S.exam.showModel=!S.exam.showModel; save(); render(); break;
    case 'togglenotes': S.exam.notesHidden=!S.exam.notesHidden; save(); render(); break;
    case 'drill': { const D=S.exam.drill; D.ans=+el.dataset.v; D.done++; if(D.ans===(DRILL[D.order[D.i]].y?1:0)) D.right++; save(); render(); break; }
    case 'drill-next': { const D=S.exam.drill; D.i++; D.ans=null; if(D.i>=D.order.length) S.exam.drillBest=Math.max(S.exam.drillBest||0, D.right); save(); render(); break; }
    case 'savepdf': savePDF(el); break;
    case 'mapview': S.mapView=k; save(); render(); break;
    case 'f3sel': S.exam.f3=id; S.exam.f3reveal=false; S.exam.f3model=false; save(); render(); break;
    case 'f3reveal': S.exam.f3reveal=!S.exam.f3reveal; save(); render(); break;
    case 'f3model': S.exam.f3model=!S.exam.f3model; save(); render(); break;
    case 'f3self': { const id3=S.exam.f3||'pedal'; S.exam.f3self=S.exam.f3self||{}; S.exam.f3self[id3]=S.exam.f3self[id3]||{}; S.exam.f3self[id3][k]=+el.dataset.v; save(); render(); break; }
    case 'f3save': { const id3=S.exam.f3||'pedal'; const any=['A','B','C'].some(x=>(S.exam.drafts[`F3:${id3}:${x}`]||'').trim()); if(!any){ toast('Write a response first'); break; } const sf=(S.exam.f3self||{})[id3]||{}; S.exam.f3hist=S.exam.f3hist||[]; S.exam.f3hist.push({s:id3,t:Date.now(),self:Object.values(sf).filter(v=>v===1).length}); save(); render(); toast('Attempt saved'); break; }
    case 'drill-restart': S.exam.drill={order:null,i:0,right:0,done:0,ans:null}; save(); render(); break;
    case 'timer-toggle': { const T=S.exam.timer; if(T.left<=0) T.left=T.sec; T.running=!T.running; if(T.running && !timerInt) timerInt=setInterval(tick,1000); if(!T.running){ clearInterval(timerInt); timerInt=null; } el.textContent=T.running?'Pause':'Start'; break; }
  }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.actInput==='setT'){ const m=mission(S.sim.mission); m.T=+el.value; $('#tVal').textContent=m.T+'%'; save();
    const b=BMAP[S.sim.biz], d=DMAP[S.sim.mission]; const tk=tokens(b,d,m);
    $$('[data-act="pickh"]').forEach(o=>{ o.querySelector('span:last-child').textContent = hypText(o.dataset.k, MISSIONS[d.id], tk); });
    const hp=$('#hypPrev'); if(hp) hp.textContent=hypText('good',MISSIONS[d.id],tk); return; }
  if(el.dataset.actInput==='bmethod'){ const it=item(S.builder.sel); const k=el.dataset.k; it.methods = el.checked ? [...new Set([...(it.methods||[]),k])] : (it.methods||[]).filter(x=>x!==k); save(); builderLive(); return; }
  if(el.dataset.bind){ const path=el.dataset.bind.split('.'); let obj = path[0]==='profile' ? S.builder.profile : item(S.builder.sel); const rest = path[0]==='profile'? path.slice(1) : path.slice(1); for(let i=0;i<rest.length-1;i++) obj=obj[rest[i]]; obj[rest[rest.length-1]] = el.value; save(); builderLive(); return; }
  if(el.dataset.ebind){ S.exam.drafts[el.dataset.ebind]=el.value; save(); examLive(); return; }
  if(el.dataset.rbind){ S.report[el.dataset.rbind]=el.value; save(); return; }
